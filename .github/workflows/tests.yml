name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The versions Wan2GP ships wheels/instructions for (see requirements.txt).
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        # Deliberately NOT requirements.txt: the suite is dependency-free by design so
        # that CI stays in the tens-of-seconds range instead of pulling CUDA wheels.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Run tests
        run: python -m pytest -v

  syntax:
    name: syntax check (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile first-party sources
        # Catches syntax errors and version-incompatible syntax without importing
        # anything, so it needs no dependencies at all.
        #
        # models/ is excluded: it holds vendored upstream model code, one file of which
        # (models/longcat/.../flash_attn_bsa_varlen_mask.py) does not parse as valid
        # Python and is not ours to fix. Anything under a vendor/ directory is skipped
        # for the same reason.
        run: |
          python -m compileall -q -j 0 \
            -x '(__pycache__|/vendor/)' \
            shared postprocessing preprocessing plugins tests wgp.py setup.py

  config-integrity:
    name: config integrity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Validate bundled JSON configuration
        # Fast standalone signal: a malformed defaults/*.json breaks model discovery at
        # startup, and that is worth failing loudly and separately from the unit tests.
        run: python -m pytest tests/test_model_configs.py -v
