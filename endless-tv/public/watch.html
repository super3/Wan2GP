<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch · endless TV</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css?v=6">
</head>
<body>
<div class="watch" id="watch">
  <div class="player" id="player"></div>

  <div class="bar top-bar">
    <a href="/" class="ctl" aria-label="Back to the guide"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <img id="logo" alt="" hidden>
    <div class="titles"><strong id="title">endless TV</strong><span id="episode"></span></div>
  </div>

  <button class="solid unmute" id="unmute" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E0E10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"></path></svg>Turn on sound</button>

  <div class="bar bottom-bar">
    <button class="ctl" id="mute" type="button" aria-label="Turn on sound"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path id="muteIcon" d="M4 9h4l5-4v14l-5-4H4zM17 9l5 6M22 9l-5 6"></path></svg></button>
    <span class="live-pill" id="livePill"><span class="live-dot"></span>LIVE</span>
    <span class="clip-info" id="clipInfo"></span>
    <div class="spacer"></div>
    <button class="ctl wide" id="chDown" type="button" aria-label="Previous channel">CH −</button>
    <span class="ch-num" id="chNum"></span>
    <button class="ctl wide" id="chUp" type="button" aria-label="Next channel">CH +</button>
    <button class="ctl" id="fullscreen" type="button" aria-label="Full screen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg></button>
  </div>
</div>
<script src="/js/compat.js?v=6"></script>
<script src="/js/live.js?v=6"></script>
<script src="/js/player.js?v=6"></script>
<script src="/js/watch.js?v=6"></script>
</body>
</html>
