<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>endless TV</title>
<meta name="description" content="TV channels that never end: every show is generated live by AI.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="top">
  <a href="/" class="brand" aria-label="endless TV"><span class="brand-word">endless</span><span class="brand-tv">TV</span></a>
  <div class="spacer"></div>
  <a class="discord" id="discord" href="#" target="_blank" rel="noopener" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189z"></path></svg><span>Join our Discord</span></a>
</header>

<main>
  <section class="hero" aria-label="Selected program" id="hero" hidden>
    <div class="hero-media">
      <div class="screen-box">
        <a class="screen" id="screen" href="#">
          <div class="player" id="player"></div>
          <img class="screen-cover" id="cover" alt="" hidden>
          <span class="badge-live" id="liveBadge">LIVE</span>
          <span class="screen-note" id="screenNote" hidden></span>
        </a>
        <button class="mute" id="mute" type="button" aria-label="Turn on sound" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path id="muteIcon" d="M4 9h4l5-4v14l-5-4H4zM17 9l5 6M22 9l-5 6"></path></svg></button>
      </div>
    </div>
    <div class="hero-info">
      <div class="chan-line"><img id="selLogo" alt=""><span class="vsep" aria-hidden="true"></span><span class="chan-number" id="selChannel"></span></div>
      <h1 id="selTitle"></h1>
      <p class="episode" id="selEpisode"></p>
      <div class="meta" id="selMeta"></div>
      <p class="blurb" id="selBlurb"></p>
      <div class="actions"><a class="solid" id="watchBtn" href="#"><svg width="14" height="14" viewBox="0 0 24 24" fill="#0E0E10" aria-hidden="true"><path d="M6 4l14 8-14 8z"></path></svg><span id="watchLabel">Watch now</span></a></div>
    </div>
  </section>

  <section class="guide" aria-label="Guide" id="guide" hidden>
    <div class="filters" id="filters"></div>
    <div class="grid-scroll">
      <div class="grid" id="grid">
        <div class="row head">
          <span class="today">Today</span>
          <div class="timeline" id="timeline"><span class="now-label" id="nowLabel"></span></div>
        </div>
        <div id="rows"></div>
        <div class="now-line" id="nowLine" aria-hidden="true"></div>
      </div>
    </div>
  </section>

  <section class="empty" id="empty" hidden>
    <p>No channels yet. GPU boxes publish clips here with <code>tools/publish.py</code>; see the README.</p>
  </section>
</main>

<script src="/js/live.js"></script>
<script src="/js/player.js"></script>
<script src="/js/guide.js"></script>
</body>
</html>
